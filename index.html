<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rutina Fuerza</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">12 semanas</p>
        <h1>Rutina Fuerza</h1>
      </div>
      <div class="week-badge" id="weekBadge">Semana 1</div>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="titulo-calendario">
        <h2 id="titulo-calendario">Calendario</h2>

        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="btnHoy">Ir a la sesión de hoy</button>
          <button type="button" class="btn" id="btnCambiarInicio">Cambiar fecha de inicio</button>
        </div>

        <p class="hint" id="programInfo">Inicio: —</p>

        <div class="legend">
          <span><i class="dot dot-pending"></i> Pendiente</span>
          <span><i class="dot dot-done"></i> Hecha</span>
          <span><i class="dot dot-skipped"></i> Omitida</span>
          <span><i class="dot dot-today"></i> Hoy</span>
        </div>

        <div class="grid-wrap">
          <table class="grid">
            <thead>
              <tr>
                <th>Semana</th>
                <th>Lun</th>
                <th>Mié</th>
                <th>Vie</th>
              </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="titulo-sesion">
        <h2 id="titulo-sesion">Sesión seleccionada</h2>

        <div id="sessionMessage" class="session-message">Seleccioná una fecha del calendario.</div>

        <div id="sessionForm" class="session-form hidden">
          <div class="row session-head">
            <span class="label">Fecha</span>
            <strong id="selectedDateLabel">—</strong>
            <span id="selectedWeekLabel" class="chip">—</span>
          </div>

          <div class="status-row">
            <button type="button" class="btn btn-done" data-status="done">Marcar como hecha</button>
            <button type="button" class="btn btn-skipped" data-status="skipped">Omitir</button>
            <button type="button" class="btn btn-ghost" data-status="clear">Borrar</button>
          </div>

          <div id="exerciseList" class="exercise-list"></div>

          <div class="note-field">
            <label for="noteInput">Observación</label>
            <textarea id="noteInput" rows="3" maxlength="500" placeholder="Cómo te sentiste hoy..."></textarea>
          </div>
        </div>
      </section>
    </main>

    <section class="panel backup-panel" aria-labelledby="titulo-backup">
      <h2 id="titulo-backup">Copia de seguridad</h2>
      <div class="toolbar backup-toolbar">
        <button type="button" class="btn" id="btnExport">Exportar JSON</button>
        <label class="btn btn-file" for="importInput">Importar JSON</label>
        <input id="importInput" type="file" accept="application/json,.json" hidden />
      </div>
      <p id="statusMessage" class="status-message" aria-live="polite"></p>
    </section>

    <template id="exerciseTemplate">
      <article class="exercise-card">
        <header class="exercise-head">
          <h3 class="exercise-name"></h3>
          <span class="exercise-badge"></span>
        </header>

        <p class="exercise-meta"></p>

        <div class="field">
          <label>Peso (kg)</label>
          <div class="weight-wrap">
            <input type="number" class="weight-input" min="0" step="0.5" inputmode="decimal" />
            <span class="unit">kg</span>
          </div>
        </div>

        <div class="field">
          <label>Series</label>
          <div class="set-grid"></div>
        </div>

        <div class="field">
          <label>Se sintió</label>
          <input type="text" class="feel-input" maxlength="60" placeholder="Fácil, moderada, difícil..." />
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
